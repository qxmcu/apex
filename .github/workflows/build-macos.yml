name: Build macOS Standalone Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS Executable
    runs-on: macos-13

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fast-recovery,test]"
          python -m pip install nuitka zstandard brotli

      - name: Compile Standalone Executable with Nuitka
        run: |
          python apex-py/build_standalone.py

      - name: Smoke test compiled macOS binary
        run: |
          chmod +x ./apex-py/dist/apex
          ./apex-py/dist/apex --version
          ./apex-py/dist/apex --help
          ./apex-py/dist/apex info pyproject.toml

      - name: Package macOS Binary and Generate Checksum
        run: |
          VERSION="${{ github.event.inputs.version || 'v1.3.0' }}"
          echo "Building package for version ${VERSION}..."
          mkdir -p release-pkg
          cp apex-py/dist/apex release-pkg/apex
          cd release-pkg
          tar -czvf "../apex-${VERSION}-darwin-x86_64.tar.gz" apex
          cd ..
          shasum -a 256 "apex-${VERSION}-darwin-x86_64.tar.gz" > "apex-${VERSION}-darwin-x86_64.tar.gz.sha256"
          echo "Package created successfully:"
          ls -la apex-*-darwin*
          cat "apex-${VERSION}-darwin-x86_64.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-darwin-x86_64
          path: |
            apex-*-darwin-x86_64.tar.gz
            apex-*-darwin-x86_64.tar.gz.sha256

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version || 'v1.3.0' }}"
          gh release upload "${VERSION}" apex-${VERSION}-darwin-x86_64.tar.gz apex-${VERSION}-darwin-x86_64.tar.gz.sha256 --clobber
