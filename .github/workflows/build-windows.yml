name: Build Windows Standalone Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows x86_64 Executable
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[fast-recovery,test]"
          python -m pip install nuitka zstandard brotli

      - name: Compile Standalone Executable with Nuitka
        run: |
          python apex-py/build_standalone.py

      - name: Smoke test compiled Windows binary
        run: |
          ./apex-py/dist/apex.exe --version
          ./apex-py/dist/apex.exe --help
          ./apex-py/dist/apex.exe info pyproject.toml

      - name: Package Windows Binary and Generate Checksum
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || 'v1.3.0' }}"
          echo "Packaging for version ${VERSION}..."
          mkdir -p release-pkg
          cp apex-py/dist/apex.exe release-pkg/apex.exe
          cd release-pkg
          7z a "../apex-${VERSION}-windows-x86_64.zip" apex.exe
          cd ..
          sha256sum "apex-${VERSION}-windows-x86_64.zip" > "apex-${VERSION}-windows-x86_64.zip.sha256"
          echo "Package created successfully:"
          ls -la apex-*-windows*
          cat "apex-${VERSION}-windows-x86_64.zip.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-windows-x86_64
          path: |
            apex-*-windows-x86_64.zip
            apex-*-windows-x86_64.zip.sha256

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version || 'v1.3.0' }}"
          gh release upload "${VERSION}" apex-${VERSION}-windows-x86_64.zip apex-${VERSION}-windows-x86_64.zip.sha256 --clobber
