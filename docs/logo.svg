<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="500" rx="100" fill="#1E1E2E" />
  
  <!-- Abstract 'A' (Apex) and Compression Box -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <!-- Base Box / Data Block -->
    <path d="M40 220 L150 290 L260 220 L150 150 Z" fill="none" stroke="url(#apexGrad)" stroke-width="25" stroke-linejoin="round" />
    
    <!-- Left Triangle Side -->
    <path d="M40 220 L150 20 L150 150 Z" fill="url(#apexGrad)" opacity="0.9" />
    
    <!-- Right Triangle Side -->
    <path d="M260 220 L150 20 L150 150 Z" fill="url(#apexGrad)" opacity="0.7" />
    
    <!-- Inner Squeeze Line (Speed/Compression) -->
    <path d="M150 100 L150 190" stroke="#1E1E2E" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>
