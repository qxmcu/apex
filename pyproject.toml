[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apexcompress"
version = "1.2.0"
description = "Adaptive tournament multi-engine compression container format with authenticated encryption and Reed-Solomon recovery"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Apex Compression Lab" }
]
keywords = [
    "compression",
    "zstandard",
    "brotli",
    "lzma",
    "tournament-compression",
    "solid-archive",
    "deduplication",
    "reed-solomon",
    "encryption"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "zstandard>=0.22.0",
    "brotli>=1.1.0",
]

[project.optional-dependencies]
fast-recovery = [
    "numpy>=1.20.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
apex = "apex.cli:main"
apexcompress = "apex.cli:main"

[tool.setuptools.package-dir]
"" = "apex-py"

[tool.setuptools.packages.find]
where = ["apex-py"]
include = ["apex*"]
